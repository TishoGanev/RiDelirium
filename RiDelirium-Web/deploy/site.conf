server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # ridelirium.app is the main address; the other names send visitors there.
    if ($host ~* ^(www\.ridelirium\.app|(www\.)?ridelirium\.com)$) {
        return 301 https://ridelirium.app$request_uri;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        expires 7d;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }
}
