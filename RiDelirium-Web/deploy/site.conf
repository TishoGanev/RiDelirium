# Where /get sends a visitor, by their browser's User-Agent. Empty = the home page, which has both store buttons.
map $http_user_agent $store_url {
    default                 "";
    "~*iphone|ipad|ipod"    "https://apps.apple.com/us/app/ridelirium/id1080784776";
    # Android: put the Google Play link here once the listing exists; until then Android gets the home page.
    "~*android"             "https://play.google.com/store/apps/details?id=com.bgdeveloper.ridelirium";
}

# ridelirium.app is the main address; the other names send visitors there, except the invite-link paths below
# (ridelirium.com/join/CODE and /.well-known/): iOS and Android fetch those directly and refuse a redirect.
map "$host$request_uri" $to_main_site {
    default 0;
    "~*^(www\.)?ridelirium\.com(/join/|/\.well-known/)" 0;
    "~*^(www\.ridelirium\.app|(www\.)?ridelirium\.com)/" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    if ($to_main_site) {
        return 301 https://ridelirium.app$request_uri;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Ride Together invite links (https://ridelirium.com/join/CODE) and the files that make them open the apps are
    # PHP in the ridersapi container (RiDelirium-Server). A variable keeps nginx starting if that container is down.
    location ~ ^/(join/|\.well-known/(apple-app-site-association|assetlinks\.json)$) {
        resolver 127.0.0.11 valid=30s;
        set $api http://ridersapi:80;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # One link for social media posts (ridelirium.app/get, also /getRiDelirium.php): an iPhone goes straight to
    # the App Store, an Android phone to Google Play; a computer, an iPad asking for the desktop site or a
    # link-preview bot gets the home page, so post previews show its title and picture.
    location ~* ^/(get|getRiDelirium(\.php)?)/?$ {
        add_header Cache-Control "no-store" always;
        add_header Vary User-Agent always;
        if ($store_url != "") {
            return 302 $store_url;
        }
        return 302 https://ridelirium.app/;
    }

    location /assets/ {
        expires 7d;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }
}
